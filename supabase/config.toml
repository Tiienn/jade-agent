project_id = "jade-file-finder"

[functions.search]
verify_jwt = false

[functions.file]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

[functions.browse]
verify_jwt = false

[functions.mail-connect]
verify_jwt = false

# Public by necessity: this is Microsoft's OAuth redirect target, so the browser
# arrives with no Authorization header. The signed `state` param is what proves
# which account consented — see _shared/oauthState.ts.
[functions.mail-callback]
verify_jwt = false

# Also reachable by the scheduler with x-cron-secret instead of a JWT.
[functions.mail-sync]
verify_jwt = false

[functions.mail-draft]
verify_jwt = false

[functions.mail-status]
verify_jwt = false

# Accepts authenticated multipart uploads. Authentication is verified inside
# the function so the browser's headerless CORS preflight can reach it.
[functions.invoice-draft]
verify_jwt = false

# Admin-configured and also invoked by pg_cron with x-cron-secret. The function
# verifies either the admin JWT or that database-owned secret itself.
[functions.lexpress-monitor]
verify_jwt = false

# Same as every other function here: the platform gate is off and the JWT is
# verified in-function (requireAdmin), so the CORS preflight can reach it.
[functions.presence-backfill]
verify_jwt = false

# Leave requests. Same arrangement as everything above — the platform JWT gate
# is off so the browser's CORS preflight (which carries no Authorization
# header) is not rejected before it arrives, and each function verifies the
# caller itself. These three verify more than identity: leave-submit refuses to
# file for someone else unless the caller is an admin, and leave-decide refuses
# a caller who is not the named approver. Turning verify_jwt on here would not
# add a check, it would only break the preflight.
[functions.leave-submit]
verify_jwt = false

[functions.leave-decide]
verify_jwt = false

[functions.leave-cancel]
verify_jwt = false

# Files a finished lease plan's DWG and PDF into SharePoint. Same arrangement as
# everything above: the platform JWT gate is off so the browser's headerless
# CORS preflight is not rejected before it arrives, and the function verifies
# the caller itself -- and more than identity, since it refuses to file a plan
# the caller neither prepared nor administers.
[functions.lease-publish]
verify_jwt = false
