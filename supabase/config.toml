[functions.mail-connect]
verify_jwt = false

# Public by necessity: this is Microsoft's OAuth redirect target, so the browser
# arrives with no Authorization header. The signed `state` param is what proves
# which account consented — see _shared/oauthState.ts.
[functions.mail-callback]
verify_jwt = false

# Also reachable by the scheduler with x-cron-secret instead of a JWT.
[functions.mail-sync]
verify_jwt = false

[functions.mail-draft]
verify_jwt = false
